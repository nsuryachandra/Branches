<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hello</title>
    <style>
        body {
            background: #042f2e;
            color: #ccfbf1;
            font-family: system-ui, sans-serif;
            display: grid;
            place-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            padding: 2.5rem;
            border-radius: 1rem;
            background: rgba(13, 148, 136, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(45, 212, 191, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { margin: 0 0 1rem; color: #2dd4bf; }
        p { color: #99f6e4; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hello!</h1>
        <p>This is the Hello Branch of this repository.</p>
    </div>
</body>
</html>
