<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
    <style>
        body {
            background: #0f172a;
            color: #f1f5f9;
            font-family: system-ui, sans-serif;
            display: grid;
            place-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            padding: 2.5rem;
            border-radius: 1rem;
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { margin: 0 0 1rem; color: #38bdf8; }
        p { color: #94a3b8; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome!</h1>
        <p>This is the Welcome Branch of this repository.</p>
    </div>
</body>
</html>
